# Licence server, database, and Caddy. Point an A/AAAA record at this VPS, set LICENSE_DOMAIN
# to that hostname, then: docker compose up -d --build
# Only ports 80 and 443 are published. The API and Postgres stay on the docker network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: checkprint
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/checkprint
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:?set LICENSE_PRIVATE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PAY_BKASH: ${PAY_BKASH:-}
      PAY_NAGAD: ${PAY_NAGAD:-}
      PAY_BANK: ${PAY_BANK:-}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      TRUST_PROXY: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?set LICENSE_DOMAIN to the hostname customers will use}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
volumes:
  dbdata:
  caddydata:
  caddyconfig:
