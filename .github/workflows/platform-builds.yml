name: CheckPrint platform installers
on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform-1.3.0]
  pull_request:
    paths: ['src/**', 'index.html', 'license.html', 'package*.json', 'scripts/**', 'build/**', '.github/workflows/platform-builds.yml']
permissions:
  contents: read
jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: checkprint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@127.0.0.1:5432/checkprint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: npm run lint
      - run: npm test
      - run: npm test
        working-directory: server
  installers:
    needs: database-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            command: npm run build:protected -- --config.win.signAndEditExecutable=false
            files: dist/win/*.exe
          - os: ubuntu-22.04
            platform: Linux
            command: npm run build:linux:protected
            files: |
              dist/linux/*.AppImage
              dist/linux/*.deb
          - os: macos-14
            platform: macOS-Intel-and-Apple-Silicon
            command: npm run build:mac:protected
            files: |
              dist/mac/*.dmg
              dist/mac/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: CheckPrint-${{ matrix.platform }}-installers
          path: ${{ matrix.files }}
          if-no-files-found: error
